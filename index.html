<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ClonerNews</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <header>
            <h1>🔶 ClonerNews</h1>
        </header>

        <div id="tabs">
            <button class="active" data-feed="topstories">Top</button>
            <button data-feed="newstories">New</button>
            <button data-feed="beststories">Stories</button>
            <button data-feed="jobstories">Jobs</button>
            <button data-feed="askstories">Poll</button>
        </div>

        <div id="live-banner">🔴 New items available — click to load them</div>

        <div id="post-list">
            <div id="status">Loading…</div>
        </div>

        <button id="load-more-btn" disabled>Load more</button>

        <script src="js/config.js"></script>
        <script src="js/ui.js"></script>
        <script src="js/api.js"></script>
        <script src="js/render.js"></script>
        <script src="js/feed.js"></script>
        <script src="js/live.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
